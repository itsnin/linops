[workspace]
members = ["core", "tui", "xtask"]
default-members = ["tui", "core"]
resolver = "2"

[workspace.package]
version = "2026.8.1"
edition = "2021"
license = "AGPL-3.0-only"
repository = "https://github.com/itsnin/linops"

[profile.release]
opt-level = "z"
debug = false
lto = true
codegen-units = 1
panic = "abort"
strip = true
incremental = false

[profile.dev]
panic = "unwind"
