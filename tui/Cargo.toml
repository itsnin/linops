[package]
name = "linops"
description = "modular linux system management tui"
edition.workspace = true
version.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "linops"
path = "src/main.rs"

[dependencies]
linops_core = { path = "../core" }
ratatui = "0.29"
crossterm = "0.28"
tokio = { version = "1", features = ["rt", "macros", "sync", "process", "io-util", "time", "signal"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
thiserror = "1"
libc = "0.2"
