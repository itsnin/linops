name: release

on:
  push:
    branches: [develop]

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: install rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl

      - name: install musl tools
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: build x86_64
        run: cargo build --release --target x86_64-unknown-linux-musl

      - name: install cross for aarch64
        run: cargo install cross --quiet

      - name: build aarch64
        run: cross build --release --target aarch64-unknown-linux-musl

      - name: rename binaries
        run: |
          cp target/x86_64-unknown-linux-musl/release/linops linops
          cp target/aarch64-unknown-linux-musl/release/linops linops-aarch64

      - name: upload to continuous release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: continuous
          name: continuous build
          body: auto-generated build from develop branch
          prerelease: true
          files: |
            linops
            linops-aarch64
